name: Atualizar fontes públicas
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - 'content/sources.json'
      - '.github/workflows/atualizar-fontes.yml'
permissions:
  contents: write
concurrency:
  group: arquivo-fontes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Consultar RSS e Atom
        id: collect
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Publicar dados e situação das fontes
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/news.json dist/data/news.js
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar acompanhamento das fontes públicas'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Sinalizar indisponibilidade das fontes
        if: steps.collect.outcome == 'failure'
        run: exit 1
